[tool.pytest.ini_options]
# Run from the claude/dev-plugin-tests/ directory (or point pytest at it).
testpaths = ["."]
markers = [
    "static: structural/static checks of the skills (no DB, no LLM) — the always-on CI gate",
    "db: SQL executed against a live MariaDB 11.8 (needs a reachable server)",
    "eval: behavioral LLM evals (needs ANTHROPIC_API_KEY; deselected by default)",
    "e2e: full Claude Code CLI run with the plugin + MCP server (needs claude, mariadb-shell, ANTHROPIC_API_KEY; deselected by default)",
]
# By default skip the slow/expensive eval + e2e tiers; opt in with `-m eval` / `-m e2e`.
addopts = "-m 'not eval and not e2e' -ra"
