[tool.pytest.ini_options]
# Run from the pi/dev-plugin-tests/ directory (or point pytest at it).
testpaths = ["."]
markers = [
    "static: structural/static checks of the skills and the pi package (no CLI, no DB, no LLM)",
    "db: SQL executed against a live MariaDB 11.8 (needs a reachable server)",
    "e2e: full pi CLI run with the package installed (needs pi + a ready provider; deselected by default)",
]
# By default skip the slow/expensive e2e tier; opt in with `-m e2e`.
# NOTE: no `eval` tier here — pi has no SDK of its own to prompt; the e2e tier
# drives the `pi` binary instead, which is the same thing one tier up.
addopts = "-m 'not e2e' -ra"
